<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
        />
        <title>Cornwall Beaches</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <style>
            /* ── Design tokens ── */
            :root {
                --sand: #f5ede0;
                --sand-dark: #e8d9c4;
                --ocean: #1a5f7a;
                --ocean-mid: #2980a0;
                --ocean-light: #4ba3c3;
                --foam: #e8f4f8;
                --kelp: #2d6a4f;
                --kelp-light: #52b788;
                --amber: #e9a84c;
                --slate: #2c3e50;
                --slate-light: #546e7a;
                --white: #ffffff;

                --radius-sm: 8px;
                --radius-md: 14px;
                --radius-lg: 22px;
                --shadow-sm: 0 2px 8px rgba(26, 95, 122, 0.12);
                --shadow-md: 0 6px 24px rgba(26, 95, 122, 0.18);
                --shadow-lg: 0 12px 40px rgba(26, 95, 122, 0.22);
                --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
                font-family: "DM Sans", sans-serif;
                background: var(--sand);
                color: var(--slate);
                overflow: hidden;
            }

            /* ── Layout ── */
            #app {
                display: flex;
                flex-direction: column;
                height: 100dvh;
            }

            /* ── Header ── */
            #header {
                background: var(--ocean);
                color: var(--white);
                padding: 12px 16px 10px;
                display: flex;
                align-items: center;
                gap: 12px;
                flex-shrink: 0;
                box-shadow: var(--shadow-md);
                z-index: 1000;
            }

            #header h1 {
                font-family: "Playfair Display", serif;
                font-size: clamp(1.1rem, 4vw, 1.4rem);
                font-weight: 700;
                letter-spacing: -0.01em;
                line-height: 1.1;
            }

            #header h1 span {
                display: block;
                font-size: 0.65em;
                font-family: "DM Sans", sans-serif;
                font-weight: 300;
                opacity: 0.75;
                letter-spacing: 0.04em;
            }

            #wave-icon {
                font-size: 1.8rem;
                flex-shrink: 0;
            }

            #beach-count {
                margin-left: auto;
                font-size: 0.78rem;
                font-weight: 500;
                background: rgba(255, 255, 255, 0.15);
                border-radius: 20px;
                padding: 4px 10px;
                white-space: nowrap;
                flex-shrink: 0;
            }

            /* ── Filter bar ── */
            #filter-bar {
                background: var(--white);
                border-bottom: 2px solid var(--sand-dark);
                padding: 10px 12px;
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                align-items: center;
                flex-shrink: 0;
                z-index: 999;
            }

            .filter-label {
                font-size: 0.7rem;
                font-weight: 500;
                color: var(--slate-light);
                text-transform: uppercase;
                letter-spacing: 0.06em;
                white-space: nowrap;
                align-self: center;
            }

            .filter-chips {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }

            .chip {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                padding: 5px 11px;
                border-radius: 20px;
                border: 1.5px solid var(--sand-dark);
                background: var(--white);
                font-size: 0.78rem;
                font-weight: 500;
                font-family: "DM Sans", sans-serif;
                color: var(--slate-light);
                cursor: pointer;
                transition: all var(--transition);
                -webkit-tap-highlight-color: transparent;
                user-select: none;
            }

            .chip:hover {
                border-color: var(--ocean-light);
                color: var(--ocean);
            }
            .chip.active {
                background: var(--ocean);
                border-color: var(--ocean);
                color: var(--white);
            }
            .chip .chip-icon {
                font-size: 0.9em;
            }

            .chip-dog.active {
                background: var(--kelp);
                border-color: var(--kelp);
            }
            .chip-seasonal.active {
                background: var(--amber);
                border-color: var(--amber);
                color: var(--slate);
            }
            .chip-nodog.active {
                background: #c0392b;
                border-color: #c0392b;
            }
            .chip-cafe.active {
                background: #7b4f2e;
                border-color: #7b4f2e;
            }
            .chip-clear {
                background: var(--foam);
                border-color: var(--ocean-light);
                color: var(--ocean);
            }
            .chip-clear:hover {
                background: var(--ocean);
                color: var(--white);
            }

            /* ── Map ── */
            #map {
                flex: 1;
                min-height: 0;
            }

            /* ── Leaflet popup overrides ── */
            .leaflet-popup-content-wrapper {
                border-radius: var(--radius-md) !important;
                box-shadow: var(--shadow-lg) !important;
                border: none !important;
                padding: 0 !important;
                overflow: hidden;
                min-width: 240px;
                max-width: min(320px, 90vw);
            }

            .leaflet-popup-content {
                margin: 0 !important;
                width: 100% !important;
            }

            .leaflet-popup-tip-container {
                margin-top: -1px;
            }
            .leaflet-popup-tip {
                background: var(--white) !important;
            }
            .leaflet-popup-close-button {
                color: var(--slate-light) !important;
                font-size: 20px !important;
                top: 10px !important;
                right: 10px !important;
                width: 28px !important;
                height: 28px !important;
                line-height: 28px !important;
                border-radius: 50% !important;
                background: rgba(255, 255, 255, 0.8) !important;
                z-index: 10;
            }

            /* ── Popup content ── */
            .popup {
                font-family: "DM Sans", sans-serif;
            }

            .popup-header {
                background: var(--ocean);
                color: var(--white);
                padding: 14px 36px 14px 16px;
            }

            .popup-name {
                font-family: "Playfair Display", serif;
                font-size: 1.05rem;
                font-weight: 700;
                line-height: 1.2;
                margin-bottom: 6px;
            }

            .popup-tags {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
            }

            .tag {
                font-size: 0.68rem;
                font-weight: 500;
                padding: 2px 8px;
                border-radius: 10px;
                background: rgba(255, 255, 255, 0.2);
                letter-spacing: 0.02em;
            }

            .tag-dog {
                background: rgba(82, 183, 136, 0.35);
            }
            .tag-seasonal {
                background: rgba(233, 168, 76, 0.4);
                color: #fff8e7;
            }
            .tag-cafe {
                background: rgba(123, 79, 46, 0.4);
            }
            .tag-no-dog {
                background: rgba(255, 255, 255, 0.12);
                opacity: 0.7;
            }

            .popup-body {
                padding: 12px 16px 14px;
                background: var(--white);
            }

            .popup-notes {
                font-size: 0.8rem;
                color: var(--slate-light);
                line-height: 1.5;
                margin-bottom: 12px;
                padding: 8px 10px;
                background: var(--foam);
                border-radius: var(--radius-sm);
                border-left: 3px solid var(--ocean-light);
            }

            .popup-link {
                display: block;
                font-size: 0.75rem;
                color: var(--ocean);
                text-decoration: none;
                margin-bottom: 12px;
                font-weight: 500;
            }
            .popup-link:hover {
                text-decoration: underline;
            }

            .popup-directions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }

            .dir-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                padding: 9px 8px;
                border-radius: var(--radius-sm);
                border: none;
                font-family: "DM Sans", sans-serif;
                font-size: 0.78rem;
                font-weight: 500;
                cursor: pointer;
                text-decoration: none;
                transition: all var(--transition);
                -webkit-tap-highlight-color: transparent;
            }

            .dir-btn-apple {
                background: var(--slate);
                color: var(--white);
            }
            .dir-btn-apple:hover {
                background: #1a252f;
            }

            .dir-btn-google {
                background: #4285f4;
                color: var(--white);
            }
            .dir-btn-google:hover {
                background: #3367d6;
            }

            .dir-btn svg {
                flex-shrink: 0;
            }

            /* ── No-location popup ── */
            .popup-no-coords {
                font-size: 0.78rem;
                color: var(--slate-light);
                font-style: italic;
                text-align: center;
                padding: 4px 0 2px;
            }

            /* ── Custom marker colours ── */
            .marker-pin {
                width: 28px;
                height: 28px;
                border-radius: 50% 50% 50% 0;
                transform: rotate(-45deg);
                border: 2px solid rgba(255, 255, 255, 0.9);
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
            }

            .marker-pin-inner {
                position: absolute;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: rgba(255, 255, 255, 0.85);
                top: 7px;
                left: 7px;
            }

            /* ── Locate-me control ── */
            .locate-btn {
                width: 30px;
                height: 30px;
                background: var(--white);
                border: 2px solid rgba(0,0,0,0.2);
                border-radius: 4px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: none;
                padding: 0;
            }
            .locate-btn:hover { background: #f4f4f4; }
            .locate-btn svg { display: block; }

            /* ── Toast / empty state ── */
            #toast {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%) translateY(80px);
                background: var(--slate);
                color: var(--white);
                padding: 10px 20px;
                border-radius: 24px;
                font-size: 0.82rem;
                font-weight: 500;
                box-shadow: var(--shadow-md);
                transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 2000;
                pointer-events: none;
                white-space: nowrap;
            }
            #toast.show {
                transform: translateX(-50%) translateY(0);
            }

            /* ── Mobile tweaks ── */
            @media (max-width: 480px) {
                #filter-bar {
                    padding: 8px 10px;
                    gap: 6px;
                }
                .chip {
                    padding: 5px 9px;
                    font-size: 0.74rem;
                }
                .filter-label {
                    font-size: 0.65rem;
                }
            }
        </style>
    </head>
    <body>
        <div id="app">
            <header id="header">
                <div id="wave-icon">🏖</div>
                <h1>Cornwall Beaches<span>Interactive Beach Finder</span></h1>
                <div id="beach-count">— beaches</div>
            </header>

            <div id="filter-bar">
                <span class="filter-label">Filter</span>
                <div class="filter-chips">
                    <button
                        class="chip chip-dog"
                        data-filter="dog"
                        title="Dogs welcome all year"
                    >
                        🐕 Dogs welcome
                    </button>
                    <button
                        class="chip chip-seasonal"
                        data-filter="seasonal"
                        title="Dogs allowed with seasonal restrictions"
                    >
                        🌤 Seasonal dogs
                    </button>
                    <button
                        class="chip chip-nodog"
                        data-filter="nodog"
                        title="No dogs allowed"
                    >
                        🚫 No dogs
                    </button>
                    <button
                        class="chip chip-cafe"
                        data-filter="cafe"
                        title="Café or refreshments on site"
                    >
                        ☕ Has café
                    </button>
                    <button class="chip chip-clear" data-filter="clear">
                        ✕ Clear
                    </button>
                </div>
            </div>

            <div id="map"></div>
        </div>

        <div id="toast"></div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            (async () => {
            const BEACHES = await fetch('beaches.json').then(r => r.json());

            // ── Map init ──────────────────────────────────
            const map = L.map("map", {
                center: [50.25, -5.0],
                zoom: 10,
                zoomControl: true,
            });

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution:
                    '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19,
            }).addTo(map);

            // Move zoom control to bottom-right so it doesn't clash with the header
            map.zoomControl.setPosition("bottomright");

            // ── Locate-me control ─────────────────────────
            L.Control.Locate = L.Control.extend({
                onAdd() {
                    const btn = L.DomUtil.create("button", "locate-btn");
                    btn.title = "Go to my location";
                    btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                        fill="none" stroke="#333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"/>
                        <line x1="12" y1="2" x2="12" y2="6"/>
                        <line x1="12" y1="18" x2="12" y2="22"/>
                        <line x1="2" y1="12" x2="6" y2="12"/>
                        <line x1="18" y1="12" x2="22" y2="12"/>
                    </svg>`;
                    L.DomEvent.on(btn, "click", L.DomEvent.stopPropagation);
                    L.DomEvent.on(btn, "click", () => {
                        if (!navigator.geolocation) {
                            showToast("Geolocation not supported by your browser");
                            return;
                        }
                        navigator.geolocation.getCurrentPosition(
                            ({ coords }) => map.setView([coords.latitude, coords.longitude], 14),
                            () => showToast("Could not get your location"),
                        );
                    });
                    return btn;
                },
                onRemove() {},
            });
            new L.Control.Locate({ position: "bottomright" }).addTo(map);

            // ── Marker colours ────────────────────────────
            const COLOURS = {
                Yes: "#2d6a4f", // kelp green  — dogs welcome
                Seasonal: "#e9a84c", // amber       — seasonal dogs
                No: "#1a5f7a", // ocean blue  — no dogs
            };

            function makeIcon(beach) {
                const colour = COLOURS[beach.dog_friendly] || COLOURS.No;
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">
    <path d="M14 0C6.268 0 0 6.268 0 14c0 9.333 14 22 14 22S28 23.333 28 14C28 6.268 21.732 0 14 0z"
          fill="${colour}" stroke="white" stroke-width="2"/>
    <circle cx="14" cy="14" r="5" fill="rgba(255,255,255,0.8)"/>
  </svg>`;
                return L.divIcon({
                    html: svg,
                    className: "",
                    iconSize: [28, 36],
                    iconAnchor: [14, 36],
                    popupAnchor: [0, -38],
                });
            }

            // ── Popup builder ─────────────────────────────
            function makePopup(b) {
                const dogTag =
                    b.dog_friendly === "Yes"
                        ? `<span class="tag tag-dog">🐕 Dogs welcome</span>`
                        : b.dog_friendly === "Seasonal"
                          ? `<span class="tag tag-seasonal">🌤 Seasonal dogs</span>`
                          : `<span class="tag tag-no-dog">🚫 No dogs</span>`;

                const cafeTag =
                    b.cafe === "Yes"
                        ? `<span class="tag tag-cafe">☕ Café</span>`
                        : "";

                const notes = b.notes
                    ? `<div class="popup-notes">${b.notes}</div>`
                    : "";

                const sourceLink = b.url
                    ? `<a class="popup-link" href="${b.url}" target="_blank" rel="noopener">↗ View on Visit Cornwall</a>`
                    : "";

                let directions = "";
                if (b.lat !== null && b.lng !== null) {
                    const appleUrl = `https://maps.apple.com/?daddr=${b.lat},${b.lng}&dirflg=d`;
                    const googleUrl = `https://www.google.com/maps/dir/?api=1&destination=${b.lat},${b.lng}`;
                    directions = `
      <div class="popup-directions">
        <a class="dir-btn dir-btn-apple" href="${appleUrl}" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
          </svg>
          Apple Maps
        </a>
        <a class="dir-btn dir-btn-google" href="${googleUrl}" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
          </svg>
          Google Maps
        </a>
      </div>`;
                } else {
                    directions = `<p class="popup-no-coords">No coordinates available for directions</p>`;
                }

                return `
    <div class="popup">
      <div class="popup-header">
        <div class="popup-name">${b.name}</div>
        <div class="popup-tags">${dogTag}${cafeTag}</div>
      </div>
      <div class="popup-body">
        ${notes}
        ${sourceLink}
        ${directions}
      </div>
    </div>`;
            }

            // ── Marker layer ──────────────────────────────
            const allMarkers = [];

            BEACHES.forEach((b) => {
                if (b.lat === null || b.lng === null) return;
                const marker = L.marker([b.lat, b.lng], { icon: makeIcon(b) });
                marker.bindPopup(makePopup(b), {
                    maxWidth: 320,
                    minWidth: 240,
                });
                marker._beachData = b;
                allMarkers.push(marker);
            });

            const markerGroup = L.layerGroup(allMarkers).addTo(map);

            // ── Beach count ───────────────────────────────
            const totalWithCoords = BEACHES.filter(
                (b) => b.lat !== null,
            ).length;
            document.getElementById("beach-count").textContent =
                `${totalWithCoords} beaches`;

            // ── Filtering ─────────────────────────────────
            let activeFilters = new Set();

            // Dog status filters are mutually exclusive — only one can be active at a time
            const DOG_FILTERS = new Set(["dog", "seasonal", "nodog"]);

            function applyFilters() {
                markerGroup.clearLayers();

                const visible = allMarkers.filter((m) => {
                    const b = m._beachData;
                    if (activeFilters.size === 0) return true;

                    // Dog status: whichever one is active must match exactly
                    if (activeFilters.has("dog") && b.dog_friendly !== "Yes")
                        return false;
                    if (
                        activeFilters.has("seasonal") &&
                        b.dog_friendly !== "Seasonal"
                    )
                        return false;
                    if (activeFilters.has("nodog") && b.dog_friendly !== "No")
                        return false;

                    // Café is independent — can be combined with any dog filter
                    if (activeFilters.has("cafe") && b.cafe !== "Yes")
                        return false;

                    return true;
                });

                visible.forEach((m) => markerGroup.addLayer(m));

                document.getElementById("beach-count").textContent =
                    activeFilters.size === 0
                        ? `${totalWithCoords} beaches`
                        : `${visible.length} of ${totalWithCoords}`;

                if (visible.length === 0)
                    showToast("No beaches match these filters");
            }

            document.querySelectorAll(".chip[data-filter]").forEach((chip) => {
                chip.addEventListener("click", () => {
                    const f = chip.dataset.filter;

                    if (f === "clear") {
                        activeFilters.clear();
                        document
                            .querySelectorAll(".chip[data-filter]")
                            .forEach((c) => c.classList.remove("active"));
                        applyFilters();
                        return;
                    }

                    // If clicking a dog-status filter, deactivate the other two first
                    if (DOG_FILTERS.has(f)) {
                        DOG_FILTERS.forEach((other) => {
                            if (other !== f && activeFilters.has(other)) {
                                activeFilters.delete(other);
                                document
                                    .querySelector(`[data-filter="${other}"]`)
                                    .classList.remove("active");
                            }
                        });
                    }

                    // Toggle the clicked filter
                    if (activeFilters.has(f)) {
                        activeFilters.delete(f);
                        chip.classList.remove("active");
                    } else {
                        activeFilters.add(f);
                        chip.classList.add("active");
                    }

                    applyFilters();
                });
            });

            // ── Toast helper ──────────────────────────────
            function showToast(msg) {
                const t = document.getElementById("toast");
                t.textContent = msg;
                t.classList.add("show");
                setTimeout(() => t.classList.remove("show"), 2800);
            }

            // ── Fit map to markers ────────────────────────
            if (allMarkers.length > 0) {
                const group = L.featureGroup(allMarkers);
                map.fitBounds(group.getBounds().pad(0.08));
            }
            })();
        </script>
    </body>
</html>
